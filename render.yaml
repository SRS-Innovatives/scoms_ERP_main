# Render Blueprint — ONE web service runs the whole SCOMS API (Render → New → Blueprint).
#
# server/server.js mounts all four portals' routers (super-admin, admin, public, staff,
# student) in a single process. On the free plan this is the only setup that stays up
# all month: free instance hours (750/month per workspace) cover exactly one always-on
# service, and one process means one cold start and one database connection pool.
# Point every VITE_*_API_URL (or just SCOMS_API_URL) in Vercel at this service's URL.
#
# The per-portal servers (SuperAdmin_Backend/src/server.js etc.) still exist for local
# development (`npm run dev`) and can be deployed separately later if traffic demands it.
#
# Mobile gateway (scoms-app-backend) is intentionally not deployed yet; with
# INTERNAL_PUSH_SECRET unset the backends skip push dispatch and keep working.

services:
  - type: web
    name: scoms-api
    runtime: node
    plan: free
    region: singapore # same region as the Supabase database
    # migrate deploy applies any new prisma/migrations on every deploy, so a new column
    # in the code can never reach production without its table change (it uses DIRECT_URL)
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 1d
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: MODULE_REGISTRY_ENABLED
        value: "false"
      - key: RBAC_ENFORCEMENT_ENABLED
        value: "true"
      - key: DATABASE_URL # Supabase transaction pooler (port 6543) + ?pgbouncer=true&connection_limit=5
        sync: false
      - key: DIRECT_URL # Supabase direct/session connection (port 5432) — used only by migrate deploy
        sync: false
      - key: CORS_ORIGINS # the Vercel site URL, e.g. https://scoms-erp-main.vercel.app ; blank = allow all
        sync: false
